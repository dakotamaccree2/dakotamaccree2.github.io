<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memory Match</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav">
        <div class="brand">🎮 Game Arcade</div>
        <nav>
          <a href="../index.html">Home</a>
          <a href="index.html">Games</a>
        </nav>
      </div>
    </header>

    <main class="container game-wrap">
      <div class="status">
        <h1>Memory Match</h1>
        <div id="moves" class="score">Moves: 0</div>
      </div>

      <div class="memory-board" id="memoryBoard"></div>

      <div class="panel">
        <button type="button" class="button primary" id="memoryReset">Shuffle cards</button>
        <a class="back-link button secondary" href="index.html">Back to games</a>
      </div>
    </main>

    <script>
      const board = document.getElementById('memoryBoard');
      const movesEl = document.getElementById('moves');
      const resetBtn = document.getElementById('memoryReset');

      const emoji = ['🍒', '🍋', '🍇', '🍉', '🍊', '🍎', '🍏', '🍓'];
      let cards = [];
      let flipped = [];
      let locked = false;
      let moves = 0;

      function buildDeck() {
        const deck = [...emoji, ...emoji].sort(() => Math.random() - 0.5);
        cards = deck.map((emojiValue, index) => ({
          id: `${emojiValue}-${index}`,
          value: emojiValue,
          matched: false
        }));
        flipped = [];
        moves = 0;
        movesEl.textContent = 'Moves: 0';
        renderBoard();
      }

      function renderBoard() {
        board.innerHTML = '';
        cards.forEach((card) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'memory-card';
          if (card.matched || flipped.some(item => item.id === card.id)) {
            button.classList.add('revealed');
          }
          if (card.matched) {
            button.classList.add('matched');
          }
          button.textContent = card.matched || flipped.some(item => item.id === card.id) ? card.value : '?';
          button.disabled = locked || card.matched || flipped.some(item => item.id === card.id);
          button.addEventListener('click', () => flipCard(card.id));
          board.appendChild(button);
        });
      }

      function flipCard(cardId) {
        if (locked) return;

        const card = cards.find(item => item.id === cardId);
        if (!card || flipped.some(item => item.id === cardId)) return;

        flipped.push(card);
        renderBoard();

        if (flipped.length === 2) {
          moves += 1;
          movesEl.textContent = `Moves: ${moves}`;
          locked = true;

          if (flipped[0].value === flipped[1].value) {
            cards = cards.map((item) => {
              if (item.id === flipped[0].id || item.id === flipped[1].id) {
                return { ...item, matched: true };
              }
              return item;
            });
            flipped = [];
            locked = false;
            renderBoard();
            checkWin();
            return;
          }

          setTimeout(() => {
            flipped = [];
            locked = false;
            renderBoard();
          }, 700);
        }
      }

      function checkWin() {
        if (cards.every(card => card.matched)) {
          setTimeout(() => {
            alert('You matched all the cards!');
          }, 120);
        }
      }

      resetBtn.addEventListener('click', buildDeck);
      buildDeck();
    </script>
  </body>
</html>
