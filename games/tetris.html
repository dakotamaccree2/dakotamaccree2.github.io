<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tetris</title>
    <link rel="stylesheet" href="../styles.css" />
    <style>
      .game-wrap { max-width: 760px; margin: 2rem auto 3rem; }
      .game-shell { display:flex; gap:1rem; align-items:flex-start; }
      canvas { background:#0f172a; border-radius:12px; }
      .sidebar { width: 180px; }
      .button.small { padding:0.5rem 0.75rem; }
      .hud { display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="container nav">
        <div class="brand">🎮 StrongDog XP</div>
        <nav>
          <a href="../index.html">Home</a>
          <a href="index.html">Games</a>
        </nav>
      </div>
    </header>

    <main class="container game-wrap">
      <div class="hud">
        <h1>Tetris</h1>
        <div class="score">Score: <span id="score">0</span></div>
      </div>

      <div class="game-shell">
        <canvas id="game" width="240" height="420"></canvas>
        <div class="sidebar">
          <p>Move: Left/Right/Down</p>
          <p>Rotate: Up</p>
          <p>Drop: Space</p>
          <button class="button primary small" id="restart">Restart</button>
          <p><a class="button secondary small" href="index.html">Back</a></p>
        </div>
      </div>
    </main>

    <script>
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.getElementById('score');
      const restartBtn = document.getElementById('restart');
      const COLS = 10;
      const ROWS = 18;
      const BLOCK = 20;
      const board = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
      const colors = ['#0cf','#f0f','#ff0','#0f0','#f60','#f00','#60f'];
      const pieces = {
        I: [[1,1,1,1]],
        O: [[1,1],[1,1]],
        T: [[0,1,0],[1,1,1]],
        S: [[0,1,1],[1,1,0]],
        Z: [[1,1,0],[0,1,1]],
        J: [[1,0,0],[1,1,1]],
        L: [[0,0,1],[1,1,1]]
      };
      let current = null;
      let score = 0;
      let dropInterval = 500;
      let lastTime = 0;

      function randomPiece() {
        const keys = Object.keys(pieces);
        const shape = pieces[keys[Math.floor(Math.random()*keys.length)]];
        const matrix = shape.map(row => row.slice());
        const startX = Math.floor((COLS - matrix[0].length) / 2);
        return { matrix, x: startX, y: -1, color: colors[Math.floor(Math.random()*colors.length)] };
      }

      function collides(matrix, x, y) {
        for (let r = 0; r < matrix.length; r++) {
          for (let c = 0; c < matrix[r].length; c++) {
            if (!matrix[r][c]) continue;
            const newX = x + c;
            const newY = y + r;
            if (newX < 0 || newX >= COLS || newY >= ROWS) return true;
            if (newY >= 0 && board[newY][newX]) return true;
          }
        }
        return false;
      }

      function merge() {
        for (let r = 0; r < current.matrix.length; r++) {
          for (let c = 0; c < current.matrix[r].length; c++) {
            if (!current.matrix[r][c]) continue;
            const y = current.y + r;
            const x = current.x + c;
            if (y >= 0) board[y][x] = current.color;
          }
        }
        clearLines();
        current = randomPiece();
        if (collides(current.matrix, current.x, current.y)) {
          alert('Game over');
          reset();
        }
      }

      function clearLines() {
        for (let r = ROWS - 1; r >= 0; r--) {
          if (board[r].every(v => v)) {
            board.splice(r, 1);
            board.unshift(Array(COLS).fill(0));
            score += 100;
            scoreEl.textContent = score;
            r++;
          }
        }
      }

      function rotate() {
        if (!current) return;
        const matrix = current.matrix[0].map((_, idx) => current.matrix.map(row => row[idx]).reverse());
        const old = current.matrix;
        current.matrix = matrix;
        if (collides(current.matrix, current.x, current.y)) current.matrix = old;
      }

      function movePiece(dir) {
        if (!current) return;
        const nx = current.x + dir;
        if (!collides(current.matrix, nx, current.y)) current.x = nx;
      }

      function dropPiece() {
        if (!current) return;
        if (!collides(current.matrix, current.x, current.y + 1)) {
          current.y++;
        } else {
          merge();
        }
      }

      function drawCell(x, y, color) {
        ctx.fillStyle = color || '#111827';
        ctx.fillRect(x * BLOCK, y * BLOCK, BLOCK, BLOCK);
        ctx.strokeStyle = 'rgba(255,255,255,0.2)';
        ctx.strokeRect(x * BLOCK, y * BLOCK, BLOCK, BLOCK);
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            drawCell(c, r, board[r][c]);
          }
        }
        if (current) {
          for (let r = 0; r < current.matrix.length; r++) {
            for (let c = 0; c < current.matrix[r].length; c++) {
              if (current.matrix[r][c]) {
                const y = current.y + r;
                const x = current.x + c;
                if (y >= 0) drawCell(x, y, current.color);
              }
            }
          }
        }
      }

      function update(time = 0) {
        const delta = time - lastTime;
        if (delta > dropInterval) {
          dropPiece();
          lastTime = time;
        }
        draw();
        requestAnimationFrame(update);
      }

      function reset() {
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) board[r][c] = 0;
        }
        score = 0;
        scoreEl.textContent = '0';
        current = randomPiece();
        lastTime = 0;
      }

      document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') movePiece(-1);
        if (e.key === 'ArrowRight') movePiece(1);
        if (e.key === 'ArrowDown') dropPiece();
        if (e.key === 'ArrowUp') rotate();
        if (e.key === ' ') { e.preventDefault(); while (!collides(current.matrix, current.x, current.y + 1)) current.y++; merge(); }
      });

      restartBtn.addEventListener('click', reset);
      reset();
      requestAnimationFrame(update);
    </script>
  </body>
</html>
