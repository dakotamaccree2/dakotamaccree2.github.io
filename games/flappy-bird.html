<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flappy Bird</title>
    <link rel="stylesheet" href="../styles.css" />
    <style>
      canvas { display:block; background:#87ceeb; border-radius:12px; }
      .game-wrap { max-width: 720px; margin:2rem auto 3rem; }
      .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; }
      .controls { display:flex; gap:1rem; margin-top:1rem; }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="container nav">
        <div class="brand">🎮 StrongDog XP</div>
        <nav>
          <a href="../index.html">Home</a>
          <a href="index.html">Games</a>
        </nav>
      </div>
    </header>

    <main class="container game-wrap">
      <div class="topbar">
        <h1>Flappy Bird</h1>
        <div class="score">Score: <span id="score">0</span></div>
      </div>
      <canvas id="game" width="420" height="560"></canvas>
      <div class="controls">
        <button class="button primary" id="restart">Restart</button>
        <a class="button secondary" href="index.html">Back</a>
      </div>
    </main>

    <script>
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.getElementById('score');
      const restartBtn = document.getElementById('restart');
      const WIDTH = canvas.width;
      const HEIGHT = canvas.height;
      let bird, pipes, score, gameOver, started;

      function resetGame() {
        bird = { x: 90, y: HEIGHT / 2, r: 16, vy: 0 };
        pipes = [];
        score = 0;
        gameOver = false;
        started = false;
        scoreEl.textContent = score;
      }

      function addPipe() {
        const gap = 140;
        const top = 30 + Math.random() * (HEIGHT - gap - 120);
        pipes.push({ x: WIDTH + 30, w: 48, gap, top, passed: false });
      }

      function flap() {
        if (gameOver) {
          resetGame();
          return;
        }
        started = true;
        bird.vy = -7;
      }

      function update() {
        if (!started || gameOver) return;
        bird.vy += 0.38;
        bird.y += bird.vy;

        if (bird.y + bird.r > HEIGHT || bird.y - bird.r < 0) {
          gameOver = true;
        }

        if (Math.random() < 0.018) addPipe();
        for (const pipe of pipes) {
          pipe.x -= 2.2;
          if (!pipe.passed && pipe.x + pipe.w < bird.x) {
            pipe.passed = true;
            score++;
            scoreEl.textContent = score;
          }
          if (bird.x + bird.r > pipe.x && bird.x - bird.r < pipe.x + pipe.w && !(bird.y - bird.r > pipe.top && bird.y + bird.r < pipe.top + pipe.gap)) {
            gameOver = true;
          }
        }
        pipes = pipes.filter(pipe => pipe.x + pipe.w > 0);
      }

      function draw() {
        ctx.clearRect(0, 0, WIDTH, HEIGHT);
        ctx.fillStyle = '#87ceeb';
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        ctx.fillStyle = '#facc15';
        ctx.beginPath();
        ctx.arc(bird.x, bird.y, bird.r, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#3a7d32';
        for (const pipe of pipes) {
          ctx.fillRect(pipe.x, 0, pipe.w, pipe.top);
          ctx.fillRect(pipe.x, pipe.top + pipe.gap, pipe.w, HEIGHT - (pipe.top + pipe.gap));
        }

        if (!started) {
          ctx.fillStyle = '#1f2937';
          ctx.font = '28px Arial';
          ctx.fillText('Tap / Space to start', 70, 100);
        }
        if (gameOver) {
          ctx.fillStyle = '#1f2937';
          ctx.font = '32px Arial';
          ctx.fillText('Game Over', 120, HEIGHT / 2);
        }
      }

      function tick() {
        update();
        draw();
        requestAnimationFrame(tick);
      }

      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
          e.preventDefault();
          flap();
        }
      });
      canvas.addEventListener('pointerdown', flap);
      restartBtn.addEventListener('click', resetGame);
      resetGame();
      requestAnimationFrame(tick);
    </script>
  </body>
</html>
