<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2048</title>
    <link rel="stylesheet" href="../styles.css" />
    <style>
      .game-wrap { max-width: 560px; margin: 2rem auto 3rem; }
      .board { display:grid; grid-template-columns: repeat(4, 1fr); gap: 0.75rem; background:#bbada0; border-radius:14px; padding:0.75rem; }
      .tile { aspect-ratio:1; border-radius:10px; background:rgba(238,228,218,.35); display:flex; align-items:center; justify-content:center; font-weight:700; font-size: clamp(1.2rem,3vw,2rem); }
      .score-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; }
      .button { border:0; }
      .controls { display:flex; gap:1rem; margin-top:1rem; }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="container nav">
        <div class="brand">🎮 StrongDog XP</div>
        <nav>
          <a href="../index.html">Home</a>
          <a href="index.html">Games</a>
        </nav>
      </div>
    </header>

    <main class="container game-wrap">
      <div class="score-row">
        <h1>2048</h1>
        <div class="score">Score: <span id="score">0</span></div>
      </div>
      <div class="board" id="board"></div>
      <div class="controls">
        <button class="button primary" id="newGame">New Game</button>
        <a class="button secondary" href="index.html">Back</a>
      </div>
    </main>

    <script>
      const boardEl = document.getElementById('board');
      const scoreEl = document.getElementById('score');
      const newGameBtn = document.getElementById('newGame');
      const size = 4;
      let board = Array.from({ length: size }, () => Array(size).fill(0));
      let score = 0;

      function emptyCells() {
        const cells = [];
        for (let r = 0; r < size; r++) {
          for (let c = 0; c < size; c++) {
            if (board[r][c] === 0) cells.push({ r, c });
          }
        }
        return cells;
      }

      function addRandomTile() {
        const cells = emptyCells();
        if (!cells.length) return;
        const { r, c } = cells[Math.floor(Math.random() * cells.length)];
        board[r][c] = Math.random() < 0.9 ? 2 : 4;
      }

      function slideLine(line) {
        const filtered = line.filter(v => v !== 0);
        for (let i = 0; i < filtered.length - 1; i++) {
          if (filtered[i] === filtered[i + 1]) {
            filtered[i] *= 2;
            score += filtered[i];
            filtered[i + 1] = 0;
          }
        }
        const merged = filtered.filter(v => v !== 0);
        while (merged.length < size) merged.push(0);
        return merged;
      }

      function move(dir) {
        const old = JSON.stringify(board);
        if (dir === 'left' || dir === 'right') {
          for (let r = 0; r < size; r++) {
            let line = board[r].slice();
            if (dir === 'right') line.reverse();
            let moved = slideLine(line);
            if (dir === 'right') moved.reverse();
            board[r] = moved;
          }
        } else {
          for (let c = 0; c < size; c++) {
            let line = [];
            for (let r = 0; r < size; r++) line.push(board[r][c]);
            if (dir === 'down') line.reverse();
            let moved = slideLine(line);
            if (dir === 'down') moved.reverse();
            for (let r = 0; r < size; r++) board[r][c] = moved[r];
          }
        }
        if (JSON.stringify(board) !== old) {
          addRandomTile();
          render();
        }
      }

      function render() {
        boardEl.innerHTML = '';
        for (let r = 0; r < size; r++) {
          for (let c = 0; c < size; c++) {
            const tile = document.createElement('div');
            tile.className = 'tile';
            const value = board[r][c];
            tile.textContent = value ? value : '';
            if (value) tile.style.background = `rgba(255,255,255,${Math.min(0.8, 0.1 + value / 60)})`;
            boardEl.appendChild(tile);
          }
        }
        scoreEl.textContent = score;
      }

      function resetBoard() {
        board = Array.from({ length: size }, () => Array(size).fill(0));
        score = 0;
        addRandomTile();
        addRandomTile();
        render();
      }

      document.addEventListener('keydown', (e) => {
        const mapping = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down', a: 'left', d: 'right', w: 'up', s: 'down' };
        const dir = mapping[e.key];
        if (dir) {
          e.preventDefault();
          move(dir);
        }
      });

      newGameBtn.addEventListener('click', resetBoard);
      resetBoard();
    </script>
  </body>
</html>
